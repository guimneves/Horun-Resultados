[project]
name = "resultados"
version = "0.1.0"
description = "Horun · Resultados — módulo do Projeto Horun"
requires-python = ">=3.11"
# Versão EXATA, nunca faixa aberta (">="): o Dockerfile reinstala tudo do
# PyPI a cada `docker compose up --build`. Uma versão nova do SQLModel já
# derrubou o Horun Core em produção sem aviso. Para atualizar: mude aqui,
# rode a suíte, só então suba. (Mesmas versões do Horun Core.)
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.3",
    "sqlmodel==0.0.47",
    "pydantic==2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]
# Fase 2: driver do PostgreSQL — só necessário na imagem Docker do
# servidor, não no desenvolvimento local (SQLite embutido no Python).
postgres = [
    "psycopg[binary]==3.3.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
